[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtripwire"
version = "0.1.1"
description = "Prompt-injection test kit for RAG apps. Plant malicious documents, query the endpoint, get a pass/fail report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "ragtripwire contributors" }]
keywords = ["prompt-injection", "rag", "llm", "security", "ai", "owasp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.scripts]
ragtripwire = "ragtripwire.cli:main"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/David-Wu1119/ragtripwire"
Issues = "https://github.com/David-Wu1119/ragtripwire/issues"
Security = "https://github.com/David-Wu1119/ragtripwire/security"
Source = "https://github.com/David-Wu1119/ragtripwire"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragtripwire = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
